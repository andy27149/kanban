kpis:
  - key: total_inbound
    label: "入库总量（吨）"
    source_file: "基础表.xlsx"
    sheet: "合计"
    mode: fixed_range
    range: "E17"
  - key: total_outbound
    label: "出库总量（吨）"
    source_file: "基础表.xlsx"
    sheet: "合计"
    mode: fixed_range
    range: "I17"
  - key: inventory_balance
    label: "库存余额合计（吨）"
    source_file: "基础表.xlsx"
    sheet: "合计"
    mode: fixed_range
    range: "K17"
  - key: actual_port_stock
    label: "锦州港实际库存合计（吨）"
    source_file: "基础表.xlsx"
    sheet: "合计"
    mode: fixed_range
    range: "L17"
  - key: purchase_coal_amount
    label: "采购煤款金额合计（元）"
    group: purchase
    group_icon: "🛒"
    group_label: "采购指标"
    source_file: "上下游结算.xlsx"
    sheet: "上游结算"
    mode: header_sum
    header_row: 2
    id_column: "合同编号"
    value_columns: ["煤款金额"]
  - key: purchase_paid_amount
    label: "采购已付金额合计（元）"
    group: purchase
    group_icon: "🛒"
    group_label: "采购指标"
    source_file: "上下游结算.xlsx"
    sheet: "上游结算"
    mode: header_sum
    header_row: 2
    id_column: "合同编号"
    value_columns: ["已付金额"]
  - key: purchase_unpaid_amount
    label: "采购未付金额合计（元）"
    group: purchase
    group_icon: "🛒"
    group_label: "采购指标"
    source_file: "上下游结算.xlsx"
    sheet: "上游结算"
    mode: header_sum
    header_row: 2
    id_column: "合同编号"
    value_columns: ["未付金额"]
  - key: purchase_refund_amount
    label: "采购应退金额合计（元）"
    group: purchase
    group_icon: "🛒"
    group_label: "采购指标"
    source_file: "上下游结算.xlsx"
    sheet: "上游结算"
    mode: header_sum
    header_row: 2
    id_column: "合同编号"
    value_columns: ["应退金额"]
  - key: sales_settlement_amount
    label: "销售结算金额合计（元）"
    group: sales
    group_icon: "💰"
    group_label: "销售指标"
    source_file: "上下游结算.xlsx"
    sheet: "下游结算"
    mode: header_sum
    header_row: 2
    id_column: "合同编号"
    value_columns: ["结算金额"]
  - key: sales_received_amount
    label: "销售已回金额合计（元）"
    group: sales
    group_icon: "💰"
    group_label: "销售指标"
    source_file: "上下游结算.xlsx"
    sheet: "下游结算"
    mode: header_sum
    header_row: 2
    id_column: "合同编号"
    value_columns: ["已回金额1", "已回金额2"]
  - key: sales_pending_amount
    label: "销售待回金额合计（元）"
    group: sales
    group_icon: "💰"
    group_label: "销售指标"
    source_file: "上下游结算.xlsx"
    sheet: "下游结算"
    mode: header_sum
    header_row: 2
    id_column: "合同编号"
    value_columns: ["待回金额"]

charts:
  - key: category_in_out
    type: bar
    title: "按品类对比入库/出库（吨）"
    source_file: "基础表.xlsx"
    sheet: "合计"
    mode: fixed_range
    x_range: "B6:B16"
    series:
      - name: "入库合计"
        range: "E6:E16"
      - name: "出库合计"
        range: "I6:I16"
  - key: inventory_balance_by_category
    type: bar
    title: "库存余额分布（吨）"
    source_file: "基础表.xlsx"
    sheet: "合计"
    mode: fixed_range
    x_range: "B6:B16"
    y_range: "K6:K16"
  - key: outbound_volume_trend
    type: line
    title: "出库船次装货量趋势（吨）"
    source_file: "基础表.xlsx"
    sheet: "出库明细"
    mode: fixed_range
    x_range: "B8:B22"
    y_range: "G8:G22"
    group_by: month
  - key: purchase_volume_by_region
    type: bar
    title: "采购按矿区汇总实发数量（吨）"
    source_file: "上下游结算.xlsx"
    sheet: "上游结算"
    mode: group_by
    agg: sum
    header_row: 2
    id_column: "合同编号"
    group_column: "矿区"
    value_column: "结算数量"
tables:
  - key: category_summary
    title: "品类汇总表"
    source_file: "基础表.xlsx"
    sheet: "合计"
    mode: fixed_range
    columns:
      - label: "矿区"
        range: "B6:B16"
      - label: "入库合计（吨）"
        range: "E6:E16"
      - label: "出库合计（吨）"
        range: "I6:I16"
      - label: "库存余额（吨）"
        range: "K6:K16"
      - label: "锦州港实际库存（吨）"
        range: "L6:L16"
    view_group: outbound_view
    view_label: "品类汇总"
  - key: outbound_detail
    title: "出库明细"
    source_file: "基础表.xlsx"
    sheet: "出库明细"
    mode: fixed_range
    columns:
      - label: "完货时间"
        range: "B8:B22"
      - label: "船名"
        range: "C8:C22"
      - label: "航次"
        range: "D8:D22"
      - label: "装货港"
        range: "F8:F22"
      - label: "装货港称重（吨）"
        range: "G8:G22"
      - label: "目的港"
        range: "AD8:AD22"
      - label: "目的港称重（吨）"
        range: "AE8:AE22"
      - label: "发货人"
        range: "AK8:AK22"
      - label: "收货人"
        range: "AL8:AL22"
    detail_range:
      group_label: "配煤品类"
      group_label_row: 5
      category_row: 6
      metric_row: 7
      data_start_row: 8
      data_end_row: 22
    view_group: outbound_view
    view_label: "出库明细"
  - key: outbound_by_shipper
    title: "出库按发货单位汇总"
    source_file: "基础表.xlsx"
    mode: shipper_summary
    view_group: outbound_view
    view_label: "按发货单位汇总"
  - key: outbound_by_shipper_monthly
    title: "出库按发货单位汇总"
    source_file: "基础表.xlsx"
    mode: shipper_summary_monthly
    view_group: outbound_view
    view_label: "按发货单位月度明细"
  - key: purchase_contracts
    title: "采购管理表"
    source_file: "上下游结算.xlsx"
    sheet: "上游结算"
    mode: sheet_table
    header_row: 2
    id_column: "合同编号"
    status_column: "进度"
    show_totals: true
  - key: order_management
    title: "订单管理表"
    source_file: "上下游结算.xlsx"
    sheet: "下游订单管理"
    mode: sheet_table
    header_row: 2
    id_column: "合同编号"
    status_column: "状态"
    show_totals: false
  - key: sales_contracts
    title: "销售管理表"
    source_file: "上下游结算.xlsx"
    sheet: "下游结算"
    mode: sheet_table
    header_row: 2
    id_column: "合同编号"
    status_column: "状态"
    show_totals: false
