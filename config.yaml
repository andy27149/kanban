kpis:
  - key: total_revenue
    label: "总营收"
    source_file: "经营数据.xlsx"
    sheet: "汇总"
    mode: fixed_range
    range: "B2"
  - key: total_profit
    label: "总利润"
    source_file: "经营数据.xlsx"
    sheet: "汇总"
    mode: header_match
    header: "利润"

charts:
  - key: monthly_sales_trend
    type: line
    title: "月度销售趋势"
    source_file: "销售明细.xlsx"
    sheet: "月度"
    mode: header_match
    x_header: "月份"
    y_header: "销售额"

tables:
  - key: sales_detail
    title: "销售明细"
    source_file: "销售明细.xlsx"
    sheet: "明细"
    mode: header_match
    columns: ["日期", "客户", "产品", "金额"]
